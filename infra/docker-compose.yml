name: trinetra

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trinetra
      POSTGRES_PASSWORD: trinetra_local
      POSTGRES_USER: trinetra
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trinetra -d trinetra']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - trinetra-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - trinetra-redis:/data

volumes:
  trinetra-postgres:
  trinetra-redis:
