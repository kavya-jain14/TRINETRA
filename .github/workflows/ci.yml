name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trinetra
          POSTGRES_PASSWORD: trinetra_ci
          POSTGRES_DB: trinetra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trinetra -d trinetra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://trinetra:trinetra_ci@localhost:5432/trinetra
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations on PostgreSQL
        run: pnpm db:migrate
      - name: Verify repository
        run: pnpm verify
